<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t">
  <title id="t">Pohľad zboku: telefón stojí displejom k hovoriacemu, predný mikrofón počúva smerom k nemu, televízor za telefónom sa stlmí</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddbc4"/><stop offset="1" stop-color="#5cc8f2"/></linearGradient>
    <linearGradient id="lobe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddbc4" stop-opacity=".45"/><stop offset="1" stop-color="#3ddbc4" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- stôl -->
  <rect x="20" y="236" width="480" height="12" rx="6" fill="#2b3566"/>
  <!-- smerová zóna predného mikrofónu (k hovoriacemu) -->
  <path d="M262 112 C 330 40, 470 60, 480 140 C 470 215, 330 225, 262 112 Z" fill="url(#lobe)" stroke="#3ddbc4" stroke-opacity=".5" stroke-dasharray="5 6"/>
  <!-- televízor za telefónom, stlmený -->
  <g transform="translate(78 150)"><rect x="-44" y="-30" width="88" height="58" rx="8" fill="#ff7d70"/><rect x="-36" y="-22" width="72" height="42" rx="5" fill="#3a1a1a"/><path d="M-14 36 h28" stroke="#ff7d70" stroke-width="4" stroke-linecap="round"/></g>
  <g stroke="#ff7d70" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".45"><path d="M136 138 q10 12 0 24"/><path d="M150 130 q16 20 0 40"/></g>
  <path d="M176 128 l24 24 M200 128 l-24 24" stroke="#ff7d70" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- stojan a telefón: displej vpravo (k hovoriacemu) -->
  <path d="M222 236 L252 200 L282 236" fill="none" stroke="#5b6690" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(252 150) rotate(-8)">
    <rect x="-9" y="-62" width="18" height="124" rx="7" fill="#121937" stroke="#7d88b8" stroke-width="2"/>
    <rect x="5" y="-56" width="4" height="112" rx="2" fill="url(#g)" opacity=".9"/>
    <circle cx="9" cy="-50" r="7" fill="url(#g)"/>
  </g>
  <!-- hovoriaci -->
  <g transform="translate(445 150)"><circle r="34" fill="#5cc8f2"/><circle cx="-6" cy="-6" r="13" fill="#0a2a3a"/><path d="M-26 30 q20 -26 40 0" fill="#0a2a3a"/></g>
  <g stroke="#5cc8f2" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M398 135 q-10 15 0 30"/><path d="M385 125 q-16 25 0 50"/></g>
</svg>
