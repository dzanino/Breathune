<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t">
  <title id="t">Pohľad zhora: telefón leží na stole, spodnou hranou k hovoriacemu, mikrofón počúva všade okolo</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddbc4"/><stop offset="1" stop-color="#5cc8f2"/></linearGradient>
    <radialGradient id="z"><stop offset="0" stop-color="#3ddbc4" stop-opacity=".30"/><stop offset="1" stop-color="#3ddbc4" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- stôl -->
  <rect x="150" y="70" width="220" height="180" rx="22" fill="#151c3d" stroke="#3a4479" stroke-width="2"/>
  <!-- zóna všade okolo -->
  <circle cx="260" cy="160" r="150" fill="url(#z)"/>
  <circle cx="260" cy="160" r="118" fill="none" stroke="#3ddbc4" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="5 6"/>
  <!-- telefón leží: displej hore, horná hrana k tebe (vľavo), spodná hrana k hovoriacemu (vpravo) -->
  <g transform="translate(260 160) rotate(-90) scale(1.4)">
    <rect x="-24" y="-44" width="48" height="88" rx="11" fill="#121937" stroke="#7d88b8" stroke-width="2"/>
    <rect x="-19" y="-39" width="38" height="78" rx="7" fill="#0a0f24"/>
    <rect x="-12" y="-20" width="24" height="5" rx="2.5" fill="url(#g)" opacity=".8"/>
    <rect x="-12" y="-10" width="16" height="5" rx="2.5" fill="url(#g)" opacity=".8"/>
    <circle cx="0" cy="44" r="7" fill="url(#g)"/>
  </g>
  <!-- ty -->
  <g transform="translate(70 160)"><circle r="30" fill="#2b3566"/><circle cy="-8" r="10" fill="#c9d1ec"/><path d="M-17 18 a17 14 0 0 1 34 0" fill="#c9d1ec"/></g>
  <!-- hovoriaci -->
  <g transform="translate(450 160)"><circle r="30" fill="#5cc8f2"/><circle cy="-8" r="10" fill="#0a2a3a"/><path d="M-17 18 a17 14 0 0 1 34 0" fill="#0a2a3a"/></g>
  <g stroke="#5cc8f2" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M405 145 q-10 15 0 30"/><path d="M392 135 q-16 25 0 50"/></g>
  <!-- televízor vľavo hore -->
  <g transform="translate(60 40)"><rect x="-34" y="-20" width="68" height="44" rx="7" fill="#ff7d70"/><rect x="-27" y="-14" width="54" height="30" rx="4" fill="#3a1a1a"/><path d="M-10 28 h20" stroke="#ff7d70" stroke-width="3" stroke-linecap="round"/></g>
  <g stroke="#ff7d70" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"><path d="M104 46 q10 12 0 24"/><path d="M116 38 q16 20 0 40"/></g>
</svg>
