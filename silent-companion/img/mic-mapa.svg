<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t">
  <title id="t">iPhone spredu a zozadu s tromi mikrofónmi</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddbc4"/><stop offset="1" stop-color="#5cc8f2"/></linearGradient>
  </defs>
  <!-- spredu -->
  <rect x="70" y="18" width="150" height="284" rx="30" fill="#121937" stroke="#7d88b8" stroke-width="2"/>
  <rect x="82" y="30" width="126" height="260" rx="20" fill="#0a0f24"/>
  <rect x="122" y="40" width="46" height="14" rx="7" fill="#1d2550"/>
  <rect x="98" y="80" width="94" height="10" rx="5" fill="#2b3566"/>
  <rect x="98" y="100" width="70" height="10" rx="5" fill="#2b3566"/>
  <rect x="98" y="132" width="94" height="10" rx="5" fill="url(#g)" opacity=".75"/>
  <rect x="98" y="152" width="58" height="10" rx="5" fill="url(#g)" opacity=".75"/>
  <g fill="#7d88b8"><circle cx="128" cy="296" r="2.2"/><circle cx="136" cy="296" r="2.2"/><circle cx="154" cy="296" r="2.2"/><circle cx="162" cy="296" r="2.2"/></g>
  <!-- 2 predný mikrofón -->
  <circle cx="145" cy="47" r="15" fill="url(#g)"/><text x="145" y="53" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#05221f">2</text>
  <!-- 1 spodný mikrofón -->
  <circle cx="145" cy="302" r="15" fill="url(#g)"/><text x="145" y="308" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#05221f">1</text>
  <!-- zozadu -->
  <rect x="300" y="18" width="150" height="284" rx="30" fill="#121937" stroke="#7d88b8" stroke-width="2"/>
  <rect x="314" y="32" width="70" height="78" rx="20" fill="#1a2148" stroke="#3a4479"/>
  <circle cx="334" cy="54" r="12" fill="#0a0f24" stroke="#5b6690" stroke-width="2"/>
  <circle cx="334" cy="88" r="12" fill="#0a0f24" stroke="#5b6690" stroke-width="2"/>
  <circle cx="364" cy="71" r="5" fill="#2b3566"/>
  <g fill="#7d88b8"><circle cx="358" cy="296" r="2.2"/><circle cx="366" cy="296" r="2.2"/><circle cx="384" cy="296" r="2.2"/><circle cx="392" cy="296" r="2.2"/></g>
  <!-- 3 zadný mikrofón -->
  <circle cx="364" cy="96" r="15" fill="url(#g)"/><text x="364" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#05221f">3</text>
  <circle cx="375" cy="302" r="15" fill="url(#g)"/><text x="375" y="308" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#05221f">1</text>
</svg>
