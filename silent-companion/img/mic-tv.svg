<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-labelledby="t">
  <title id="t">Kde môže byť televízor pri smerovom mikrofóne: za telefónom dobre, zboku čiastočne, za hovoriacim zle</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddbc4"/><stop offset="1" stop-color="#5cc8f2"/></linearGradient>
    <symbol id="ty" viewBox="-20 -20 40 40"><circle r="20" fill="#2b3566"/><circle cy="-5" r="7" fill="#c9d1ec"/><path d="M-11 12 a11 9 0 0 1 22 0" fill="#c9d1ec"/></symbol>
    <symbol id="on" viewBox="-20 -20 40 40"><circle r="20" fill="#5cc8f2"/><circle cy="-5" r="7" fill="#0a2a3a"/><path d="M-11 12 a11 9 0 0 1 22 0" fill="#0a2a3a"/></symbol>
    <symbol id="tv" viewBox="-24 -18 48 36"><rect x="-24" y="-16" width="48" height="30" rx="5" fill="#ff7d70"/><rect x="-19" y="-11" width="38" height="20" rx="3" fill="#3a1a1a"/></symbol>
    <symbol id="ph" viewBox="-8 -14 16 28"><rect x="-7" y="-13" width="14" height="26" rx="4" fill="#121937" stroke="#7d88b8" stroke-width="1.6"/><circle cy="-13" r="3.4" fill="#3ddbc4"/></symbol>
  </defs>
  <!-- panel A: TV za tebou -->
  <g transform="translate(0 0)">
    <rect x="8" y="8" width="204" height="234" rx="20" fill="#121937" stroke="#3ddbc4" stroke-opacity=".6" stroke-width="2"/>
    <path d="M110 150 L72 52 A105 105 0 0 1 148 52 Z" fill="#3ddbc4" fill-opacity=".18"/>
    <use href="#on" x="90" y="32" width="40" height="40"/>
    <use href="#ph" x="102" y="136" width="16" height="28"/>
    <use href="#tv" x="86" y="208" width="48" height="30"/>
    <circle cx="186" cy="34" r="15" fill="#3ddbc4"/><path d="M179 34 l5 5 9 -10" stroke="#05221f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- panel B: TV zboku -->
  <g transform="translate(220 0)">
    <rect x="8" y="8" width="204" height="234" rx="20" fill="#121937" stroke="#ffa27a" stroke-opacity=".6" stroke-width="2"/>
    <path d="M110 150 L72 52 A105 105 0 0 1 148 52 Z" fill="#3ddbc4" fill-opacity=".18"/>
    <use href="#on" x="90" y="32" width="40" height="40"/>
    <use href="#ph" x="102" y="136" width="16" height="28"/>
    <use href="#tv" x="18" y="128" width="48" height="30"/>
    <circle cx="186" cy="34" r="15" fill="#ffa27a"/><path d="M179 34 h14" stroke="#3a1a10" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- panel C: TV za hovoriacim -->
  <g transform="translate(440 0)">
    <rect x="8" y="8" width="204" height="234" rx="20" fill="#121937" stroke="#ff7d70" stroke-opacity=".6" stroke-width="2"/>
    <path d="M110 150 L72 52 A105 105 0 0 1 148 52 Z" fill="#3ddbc4" fill-opacity=".18"/>
    <use href="#tv" x="86" y="14" width="48" height="30"/>
    <use href="#on" x="90" y="52" width="40" height="40"/>
    <use href="#ph" x="102" y="136" width="16" height="28"/>
    <circle cx="186" cy="34" r="15" fill="#ff7d70"/><path d="M180 28 l12 12 M192 28 l-12 12" stroke="#3a1a1a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
